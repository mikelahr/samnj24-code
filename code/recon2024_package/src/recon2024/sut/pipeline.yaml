#########################################################
process_rpc_tax_inputs:       # writes the rpc stage's tax inputs for {year}
  target_folder: rpc_process
  census:
    folder: government
    file: GOVSLOCALFINTIMESERIES.GS00LOCALFIN_2026-09-21T112416.zip
    lines:                    # 22slsstab1 line -> GS00LOCALFIN items
      L9:  {label: Property, plus: [LF0009]}
      L11: {label: General sales, plus: [LF0011]}
      L12: {label: Selective sales, plus: [LF0012]}
      L13: {label: Motor fuel, plus: [LF0015]}
      L14: {label: Alcoholic beverage, plus: [LF0016]}
      L15: {label: Tobacco products, plus: [LF0017]}
      L16: {label: Public utilities, plus: [LF0020]}
      L17: {label: Other selective sales, plus: [LF0012], minus: [LF0015, LF0016, LF0017, LF0020]}
      L18: {label: Individual income, plus: [LF0023]}
      L19: {label: Corporate income, plus: [LF0024]}
      L20: {label: Motor vehicle license, plus: [LF0029]}
      L21: {label: Other taxes, plus: [LF0008], minus: [LF0009, LF0010, LF0022, LF0029]}
      L23: {label: Current charges, plus: [LF0041]}
      L24: {label: Education, plus: [LF0042]}
      L27: {label: Hospitals, plus: [LF0047]}
  irs:
    folder: government
    file: irs_state_collections_FY2024.csv
    column: business_income
  total_income_tax:           # IRS SOI Historic Table 2 (irs.gov, via the browser 2026-09-21)
    folder: government
    file: irs_soi_historic_table2_TY2022_TY2023_state_totals.csv
    column: A06500              # income tax after credits, $k
    income_folder: sainc
    income_file: SAINC4__ALL_AREAS_1929_2025.csv

#########################################################
create_vectors:
  target:
    folder: target
    file: vectors.csv

  decimals: 5

  # RECON2024: the 2024 SUT columns balance at basic prices; taxes on products
  # less subsidies (nettax_commodity, $1.01T) are carried outside the column
  # identity and regional other production taxes = SAGDP/CAINC total less them
  va_basic: true
  # RECON2024 item 7 (Mike 2026-09-21: adopted): nonresident travel and
  # education spending moved from PCE to exports, by state where spent
  # (built by code/scripts/build_travel_exports_state.py)
  travel_exports:
    folder: target
    file: travel_exports_state_commodity_{year}.csv

  # RECON2024: value added above output (Mike 2026-09-21: plan 2, plan 1 back-up)
  va_output:
    f_min: 0.02            # minimum intermediate-input share of output
    min_comp_share: 0.15   # below this compensation/VA (national), output is split by GDP share
    diagnostics: ../process/SUT/va_output_diag

  # RECON2024: state trade vectors from the Census state pipeline
  state_trade:
    folder: trade
    imports: retained_imports_state_bea_2024_SUTscaled.csv
    exports: exports_with_gateway_state_bea_2024.csv   # RECON2024 2026-09-27: netted exports + wholesale part of the gateway margin
    export_cap: 0.9        # max share of a state industry's output that can be exported
    gateway_margin:        # RECON2024 2026-09-27: ESR gateway service margin by state
      file: gateway_margin_state_2024.csv
      wholesale_share: 0.786          # 2017 benchmark: wholesale 78.6% (already in the goods export shares), transport 21.4%
      wholesale_prefix: []            # wholesale part carried with the goods (trade build); only transport placed here
      transport: ['481000', '482000', '483000', '484000', '486000']
    services:              # states' shares of international imports of services
      sapce:
        folder: pce
        file: SAPCE4__ALL_AREAS_1997_2024.csv
      household_allocator:   # commodity -> SAPCE4 line for the household part
        'S00300': 129          # noncomparable imports: foreign travel by U.S. residents
        '481000': 64           # air transportation (passenger fares)
        '483000': 65           # water transportation
        '561500': 129          # travel arrangement
        '611A00': 97           # higher education (study abroad)
        '611B00': 95           # other education
        '622000': 51           # hospitals (medical care abroad)
        '5241XX': 109          # insurance
        '524200': 109
        '52A000': 105          # financial services
        '523A00': 105
        '523900': 105
      goods_import_allocated: ['483000', '488A00', '4A0000', '493000']   # port, freight, warehousing
      force_services: ['S00300']    # Census puts HS 98/99 hold-outs here; allocate as travel etc.
      intermediate_weight: payroll   # payroll | output: how the buying industries are placed in states
      producer_lq_alpha: 0.5         # import propensity ~ LQ(producing industry payroll)^-alpha; 0 = off
      government:
        folder: target
        file: government_2024.csv
    state_codes:
      file: government_config.xlsx
      sheet: state_codes
  
  
#########################################################
export_state_use_A:
  folder: results
  subfolder_A: Amatrices_use
  subfolder_B: Bmatrices
  subfolder_U: Usematrices
  prefix: 'recon{year}_'
  suffix: '.csv'
  decimals: 6
  ratio_bounds: [0.25, 4.0]     # state/US intermediate-use fraction ratio, per industry
  import_share_cap: 0.95        # max international import share of a state's use of a commodity
  zero_if_national_imports_nonpositive: true   # 483000/492000 etc.: BEA CIF/FOB adjustment, no own import leakage

#########################################################
export_A_matrices:
  folder: results
  subfolder: Amatrices
  prefix: 'recon{year}_Amatrix_'
  suffix: '.csv'
  ratio_bounds: [0.25, 4.0]   # RECON2024: bound state/US intermediate-use ratio (as export_state_use_A)
  clip_supplydemand: true   # RECON2024: bound supply/demand to [0,1] before scaling A (negative national imports)
    
  decimals: 5
  


#########################################################
# RECON2024: demand net of international imports by region x commodity,
# read by the rpc stage (supply / domestic demand; RPC = m / (m + im_dom)).
export_domestic_demand:
  target:
    folder: target
    file: domestic_demand_{year}.csv
    diagnostics: domestic_demand_phi_{year}.csv
  ratio_bounds: [0.25, 4.0]
  phi_bounds: [0.5, 2.0]     # reporting only
  import_share_cap: 0.95     # as export_state_use_A
  county_state_recipes: true   # counties use their state's input recipes (state r_s)
  county_imports_by_use: true
  write_county_imports: true    # item 5: also write them into vectors.csv (results `imports` column)   # counties get the state's imports by use share, not output share
  decimals: 1
