#########################################################
# RECON2024: target_agg = {year} 71-sector summary; source_det = the 421-sector
# construction package (already at {year} prices and balanced to the summary);
# source_agg = the same {year} summary, so the aggregate projection ratio is 1
# and create_target only reconciles the detail to the BEA statistics.
extract_summary_year:
  source_folder: aggregate
  target_folder: target
  sheet: Table
  files:
    use:
      source: Use_Summary.xlsx
      target: Use_{year}.xlsx
    supply:
      source: Supply_Summary.xlsx
      target: Supply_{year}.xlsx

process_suts:
  suts:
    target_agg: 
      info: 'aggregate data {year}'
      config: load_aggregate
      file: sut_agg_{year}.xlsx
    source_agg: 
      info: 'aggregate data {year} (source = target, see note)'
      config: load_aggregate
      file: sut_agg_{year}_source.xlsx
    source_det: 
      info: 'detailed data {year}, 421-sector construction package'
      config: load_construction
      file: sut_det_{year}.xlsx

  folder: target

  codes_bridges:
    file: bridge_config.xlsx
    sheets:
      final:
        codes: final_demand
        load_aggregate: final_demand_agg
        load_benchmark: final_demand_det             
        load_construction: final_demand_det
      primary:
        codes: value_added
        load_aggregate: value_added_agg
        load_benchmark: value_added_det             
        load_construction: value_added_det
      trade:
        codes: trade_imports
        load_aggregate: trade_imports_agg
        load_benchmark: trade_imports_det             
        load_construction: trade_imports_det

  replace:
    target_agg:    
      - path: [source, folder]
        value: target
      - path: [source, files, use]
        value: Use_{year}.xlsx
      - path: [source, files, supply]
        value: Supply_{year}.xlsx
    source_agg:    
      - path: [source, folder]
        value: target
      - path: [source, files, use]
        value: Use_{year}.xlsx
      - path: [source, files, supply]
        value: Supply_{year}.xlsx

  reallocate_margins:
    source: sup_tra
    target:
      sup_int: 1
      use_int: -1
    codes: 
      ['TRADE', 'TRANS']

  subtract_subsidy: 
    table: use_pri
    subsidy: 'T00OSUB'
    tax: 'T00OTOP'

  merge_subsidies:
    subsidy: ''


#########################################################
iot_structure:
  data:
    use_int:
      label: use_intermediate 
      index: industries
      columns: industries

    use_fin:
      label: use_final 
      index: industries
      columns: final

    use_pri:
      label: use_primary
      index: primary
      columns: industries

    D:
      label: supply_technical
      index: commodities
      columns: industries

    A:
      label: use_technical
      index: industries
      columns: industries

  codes:
    industries: industry sectors
    final: final demand categories 
    primary: primary input categories

  internal_codes: [industries]


#########################################################
sut_structure:
  data:
    use_int:
      label: use_intermediate 
      index: commodities
      columns: industries

    use_fin:
      label: use_final 
      index: commodities
      columns: final

    use_pri:
      label: use_primary
      index: primary
      columns: industries

    sup_int:
      label: supply_intermediate
      index: commodities
      columns: industries

    sup_tra:
      label: supply_trade
      index: commodities
      columns: trade

  codes:
    commodities: commodity categories   
    industries: industry sectors
    final: final demand categories 
    primary: primary input categories
    trade: supply transformations and imports

  internal_codes: [commodities, industries]

#########################################################
load_aggregate:
  source:
    folder: aggregate
    sheet: Table
    files:
      use: Use_2017.xlsx
      supply: Supply_2017.xlsx

  data:
    use_int:
      file: use
      data: [C, 8, BU, 80]
      columns: [C, 6, BU, 6]
      index: [A, 8, A, 80]

    use_fin:
      file: use
      data: [BW, 8, CO, 80]
      columns: [BW, 6, CO, 6]
      index: [A, 8, A, 80]

    use_pri:
      file: use
      data: [C, 82, BU, 89]
      columns: [C, 6, BU, 6]
      index: [A, 82, A, 89]

    sup_int:
      file: supply
      data: [C, 8, BU, 80]
      columns: [C, 6, BU, 6]
      index: [A, 8, A, 80]

    sup_tra:
      file: supply
      data: [BW, 8, CE, 80]
      columns: [BW, 6, CE, 6]
      index: [A, 8, A, 80]

  codes:
    commodities:
      file: use
      data: [A, 8, B, 80]
      columns: [code, title]
    industries:
      file: use
      data: [C, 6, BU, 7]
      columns: [code, title]
      transpose: True
    final:
      file: use
      data: [BW, 6, CO, 7]
      columns: [code, title]
      transpose: True
    primary:
      file: use
      data: [A, 82, B, 85]
      columns: [code, title]
    trade:
      file: supply
      data: [BW, 6, CE, 7]
      columns: [code, title]
      skip: ['T013', 'T014']
      transpose: True

  
#########################################################
load_construction:
  reader: construction
  source:
    folder: construction
    files:
      use: Use_revised_NAICS421_{year}.csv
      supply: Supply_revised_NAICS421_{year}.csv
  value_added_rows: [V00100, T00OTOP, V00300]
  trade_columns: [MCIF, MADJ, TRADE, TRANS, MDTY, TOP, SUB]
  skip_rows: [T018]
  skip_columns: [T001, T019]
  titles:
    benchmark_config: load_benchmark
    construction_file: construction.xlsx
    construction_sheet: naics31

#########################################################
load_benchmark:
  source:
    folder: benchmark
    sheet: '2017'
    files:
      use: Use_SUT_Framework_2017_DET.xlsx
      supply: Supply_2017_DET.xlsx

  data:
    use_int:
      file: use
      data: [C, 7, 'ON', 408]
      columns: [C, 6, 'ON', 6]
      index: [A, 7, A, 408]

    use_fin:
      file: use
      data: [OP, 7, PH, 408]
      columns: [OP, 6, PH, 6]
      index: [A, 7, A, 408]

    use_pri:
      file: use
      data: [C, 410, 'ON', 416]
      columns: [C, 6, 'ON', 6]
      index: [A, 410, A, 416]

    sup_int:
      file: supply
      data: [C, 7, 'ON', 408]
      columns: [C, 6, 'ON', 6]
      index: [A, 7, A, 408]

    sup_tra:
      file: supply
      data: [OP, 7, OX, 408]
      columns: [OP, 6, OX, 6]
      index: [A, 7, A, 408]


  codes:
    commodities:
      file: use
      data: [A, 7, B, 408]
      columns: [code, title]
    industries:
      file: use
      data: [C, 5, 'ON', 6]
      columns: [title, code]
      transpose: True
    final:
      file: use
      data: [OP, 5, PH, 6]
      columns: [title, code]
      transpose: True
    primary:
      file: use
      data: [A, 410, B, 412]
      columns: [code, title]
    trade:
      file: supply
      data: [OP, 5, OX, 6]
      columns: [title, code]
      skip: ['T013', 'T014']
      transpose: True


#########################################################
process_bea:
  source:
    file: bea_config.xlsx
    sheets:
      agg: 'tax_agg'
      det: 'tax_det'
    columns:
      tax: 'T00TOP'
      subsidy: 'T00SUB'

  target:
    folder: target
    file: bea_statistics.xlsx
    levels: ['agg', 'det']
    data:
      pce: ['pce']
      gdp: ['wages', 'nettax', 'surplus']

  pce_adhoc: # in million dollars
    'S00300': 121118
    'S00900': -140601

  pce_other_service:
    reset: ['813100', '813A00', '813B00']
    control: ['811100', '811200', '811300', '811400', 
              '812100', '812200', '812300', '812900', '814000']

  gdp_other_service:
    va: ['nettax', 'surplus']
    remove: '814000'
    distribute: ['811100', '811200', '811300', '811400', 
              '812100', '812200', '812300', '812900', 
              '813100', '813A00', '813B00']

  overseas: # in million dollars
    - {industry: 'S00600', primary: 'wages', value: 5761}
    - {industry: 'S00500', primary: 'wages', value: 32115}
    - {industry: 'S00500', primary: 'surplus', value: 108617}
    
  va_zeros:
    - {target: '333314',source: '333318', fraction: 0.3}
    - {target: '333316',source: '333318', fraction: 0.1}
    - {target: '335912',source: '335911', fraction: 0.4}
    - {target: '515200',source: '515100', fraction: 0.4}
    - {target: '52A000',source: '522A00', fraction: 0.6}

  housing:
    - {'agg': 'ORE', 'va': 'nettax', 'source': '531ORE', 
      'target': '531HSO'}
    - {'agg': 'ORE', 'va': 'surplus', 'source': '531ORE', 
      'target': '531HSO'}
    - {'agg': 'HS', 'va': 'wages', 'source': '531HST', 
      'target': '531ORE'}
    
  trade:
    individual: 
      - {'aggregate': '441', 'detailed': '441000'} 
      - {'aggregate': '445', 'detailed': '445000'} 
      - {'aggregate': '452', 'detailed': '452000'} 
    bulk: ['444000', '446000', '447000', '448000', '454000',
     '4B0000']

  government_aggregate:
    - {'agg': 'GFGN', 'va': 'wages', 'source': 'S00600', 
      'target': 'S00500'}
    - {'agg': 'GFE', 'va': 'wages', 'source': '491000', 
      'target': 'S00500'}
    - {'agg': 'GFGN', 'va': 'nettax', 'source': 'S00600', 
      'target': 'S00102'}
    - {'agg': 'GFE', 'va': 'surplus', 'source': '491000', 
      'target': 'S00600'}
    - {'agg': 'GSLG', 'va': 'wages', 'source': 'GSLGE', 
      'target': 'S00203'}
    - {'agg': 'GSLG', 'va': 'surplus', 'source': 'GSLGE', 
      'target': 'S00203'}

  government_detailed:
    - {'va': 'nettax', 'source': '491000', 'target': 'S00102'}
    - {'va': 'nettax', 'source': 'S00101', 'target': 'S00102'}
    - {'va': 'nettax', 'source': 'GSLGE', 'target': 'S00203'}
    - {'va': 'nettax', 'source': 'GSLGH', 'target': 'S00203'}
    - {'va': 'nettax', 'source': 'GSLGO', 'target': 'S00203'}
    - {'va': 'nettax', 'source': 'S00201', 'target': 'S00203'}
    - {'va': 'nettax', 'source': 'S00202', 'target': 'S00203'}

  government_scaled:
    va: ['wages', 'surplus']
    source: '491000'
    ratio: 'S00101'
    target: 'S00102'
    
  balancing:
    n: 500
    alpha: 0.1 


#########################################################
process_government:
  target:
    folder: target
    file: government_2024.csv   # RECON2024 2026-09-27: government.csv is write-locked; Census + USAspending proxies live here

  source:
    file: government_config.xlsx
    sheets: ['state_local', 'state_codes']   # RECON2024: no 'federal' sheet in the workbook
    
  url: "https://api.usaspending.gov/api/v2/search/spending_by_category/awarding_agency"

  request:
    category: "awarding_agency"
    limit: 100
    page: 1
    spending_level: "transactions"
    filters:
      place_of_performance_scope: "domestic"
      place_of_performance_locations: 
        - country: "USA"
          state: none
      time_period: 
        - start_date: "{year}-01-01"
          end_date: "{year}-12-31"

  state_local:
    other: ['Current operations']
    education: ['Education']
    health: ['Hospitals', 'Health']

  industries:
    defense: S00500
    nondefense: S00600
    other: GSLGO
    education: GSLGE
    health:  GSLGH
     

