stage: sut

dirs:
  aggregate: raw/SUT_71sectors/
  benchmark: raw/SUT_benchmark/
  transport: raw/FAF/
  construction: Construction_IO_2024/outputs/
  trade: raw/Trade/out_2024_ESR/   # RECON2024 2026-09-27: ESR vectors (common-rate, mu .2529); was raw/Trade/out_2024/
  pce: raw/PCE/
  government: raw/Government/
  sainc: raw/SAINC/
  rpc_process: RECON2024/{process}/RPC/
  target: RECON2024/{process}/SUT/
  results: RECON2024/{results}/

# RECON2024: this stage changes substantively (see README_RECON2024_port.md):
#   process_suts + create_target  - REPLACED by import_construction_sut: the
#       421-sector Use/Supply_revised_NAICS421_2024 from Construction_IO_2024
#       is the balanced detail SUT (no 2017-detail-to-aggregate projection).
#   process_margins  - FAF6 2024 extract replaces faf_selected_subset (FAF5 2022).
#   process_bea      - VA distribution on the 421 axis (construction rows are
#       NAICS industries, not BEA structure types).
#   create_vectors   - state imports and exports come from raw/Trade/out_2024
#       (retained imports, netted exports by BEA commodity) plus a services
#       allocation; no longer national imports x wage share.
#   export_A_matrices - one A_domestic per STATE (state import vector), plus
#       counties from their state's A.
steps:
  - extract_summary_year
  - process_suts
  # - process_margins
  # - create_bridge
  # - process_bea
  # - apply_margins
  # - create_symmetric
  # - process_government
  - process_government_census   # RECON2024: {year} state & local from Census
  - process_government_usaspending  # RECON2024: FY{year} federal contracts by place of performance
  - process_rpc_tax_inputs      # RECON2024: {year} tax inputs for the rpc stage
  # - create_state_trade       # to write
  # - create_vectors
  # - export_A_matrices
  - export_state_use_A       # RECON2024: Use-side domestication (state B_dom and A)
  - export_domestic_demand   # RECON2024: demand net of international imports, for the rpc stage

#########################################################
create_target:
  params:
    maxstep: 0.2
    stepreduce: 0.5
    eps: 1.0
    nmax: 5000
    uscale: [0.0, 0.01, 1.0]

  adhoc_fix_other: ['S00300', 'S00900']

  target:
    # key: target_det
    # info: 'estimated detailed data 2022'
    folder: target
    init_det: sut_det_{year}_initial.xlsx
    init_agg: sut_agg_{year}_initial.xlsx
    init_diff: sut_agg_{year}_init_diff.xlsx
    bal_det: sut_det_{year}_balanced.xlsx
    bal_agg: sut_agg_{year}_balanced.xlsx
    bal_diff: sut_agg_{year}_bal_diff.xlsx


#########################################################
create_symmetric:
  noncomparable: 'S00300'

  nettax_extra: 'result_extra'
    
  target:
    folder: target
    files: 
      sut: sut_reallocated.xlsx
      iot: iot.xlsx
   
  decimals: 5

#########################################################
apply_margins:
  target:
    folder: target
    file: sut_det_{year}_margins.xlsx
    # statistics: margins_results.xlsx

  balance:
    eps: 1.0
    nmax: 5000 


#########################################################
process_margins:
  source:
    raw_transport:
      folder: transport
      file: faf6_selected_subset.csv   # RECON2024: FAF6 2022 base (was FAF5 faf_selected_subset.csv)
      fields:
        value: current_million dollars in 2022   # FAF6 base-year 2022 values (latest FAF benchmark)
        sector: sctg2
        margin: dms_mode

  target:
    folder: target
    file: margins_template.xlsx
    internal: margins_config_FAF6.xlsx   # RECON2024: FAF6 tra_raw_sector; original margins_config.xlsx untouched
    sheets:
      raw_transport:
        margin: tra_raw_margin
        sector: tra_raw_sector
      transport:
        margin: transport_margin
        sector: transport_sector
      wholesale:
        margin: wholesale_margin
        sector: wholesale_sector
      retail:
        margin: retail_margin
        sector: retail_sector
        
  sut_codes:
    trade: 'TRADE'
    transport: 'TRANS'

  trade_initial_digits:
    wholesale: ['42']
    retail: ['44', '45', '4B']
    
  transport_margins:
    '1': '484000'
    '2': '482000'
    '3': '483000'
    '4': '481000'  
    '5': '482000'
    '6': '486000'


