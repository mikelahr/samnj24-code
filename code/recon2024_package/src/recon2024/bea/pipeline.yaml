  source:
    folder: pce
    pce_previous: final_results_413_commodities_by_state.xlsx
    old_lines: PCE_state_gauss_div.txt
    bridge: bridge_PCE_USE_gauss.txt
    sapce4: SAPCE4__ALL_AREAS_1997_2024.csv
  national:                 # national PCE by commodity, first file found
    unit_factor: 1.0        # SUT PCE $M -> SAPCE4 / 413-file units ($M)
